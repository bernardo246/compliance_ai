# PRODUÇÃO — o que cada VM roda, atrás de um load balancer do provedor. Serve para 1 VM ou para várias.
#
#   internet ──HTTPS──► load balancer ──HTTP──► VM 1: nginx ► backend (N réplicas) ─┐
#                       (certificado, TLS)  └─► VM 2: nginx ► backend (N réplicas) ─┼► Redis gerenciado (único)
#                                           └─► VM n ...                           ─┘   Supabase, OpenRouter
#
# Dois níveis de balanceamento: o do PROVEDOR reparte entre as VMs; o Nginx de cada VM reparte entre as
# réplicas daquela VM. O estado (rate limit, fila, cache) já é compartilhado: Redis e Supabase ficam
# FORA das VMs, então VMs podem entrar e sair sem perder nada. Todas as VMs usam o MESMO .env.production
# (mesmas chaves JWT, mesmo REDIS_URL). O HTTPS e o certificado ficam no load balancer (a VM não tem
# certificado nem porta 443); o Nginx confia no IP do cliente informado por ele, mas só vindo das faixas
# dele: defina LB_TRUSTED_CIDRS (obrigatória; sem ela o Nginx não sobe).
#
# Antes de subir (em cada VM):
#   1. cp backend/.env.production.example backend/.env.production   # e preencha (igual em todas as VMs)
#   2. LB_TRUSTED_CIDRS="faixa1,faixa2" docker compose -f docker-compose.prod.yml up -d --build
#      (as faixas são as de ORIGEM das conexões do load balancer ao backend; no README há como achar)
#   3. firewall da VM: porta 80 aberta SÓ para essas faixas (e para os health checks do load balancer).
#   4. no load balancer: health check em GET /api/health (liveness; NÃO use /api/health/ready: se o Redis
#      cair, todas as VMs sairiam da rotação juntas e o app inteiro ficaria fora, em vez de degradado).
#
# Número de réplicas por VM (padrão 2): BACKEND_REPLICAS=3 ... up -d --build
# Imagem já publicada em um registry em vez de buildar na VM:
#   BACKEND_IMAGE=registry.exemplo.com/compliance-backend:1.0.0 docker compose -f docker-compose.prod.yml up -d --no-build
# Faça o build NA VM (ou com --platform linux/amd64): imagem de Mac com chip Apple é arm64 e não roda em VM x86.

services:
  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-compliance-backend:prod}
    env_file: ./backend/.env.production
    environment:
      # Atrás do Nginx: req.ip (rate limit e auditoria) vem do X-Forwarded-For.
      TRUST_PROXY: "true"
      # Nunca ligado em produção.
      ENABLE_DEBUG_ENDPOINT: "false"
      # Se o Redis gerenciado usar uma CA própria (não pública), descomente estas
      # duas linhas e a de `volumes`, e coloque o certificado em ./certs/redis-ca.pem:
      # NODE_EXTRA_CA_CERTS: /certs/redis-ca.pem
    # volumes:
    #   - ./certs/redis-ca.pem:/certs/redis-ca.pem:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    # O upload bufferiza o arquivo em memória (até 20 MB): dimensione por réplica.
    mem_limit: 768m
    cpus: 1.0

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      LB_TRUSTED_CIDRS: ${LB_TRUSTED_CIDRS:?defina LB_TRUSTED_CIDRS com as faixas de IP do load balancer, separadas por vírgula}
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # A imagem do Nginx executa os .sh de /docker-entrypoint.d/ antes de iniciar.
      - ./nginx/lb-trusted-proxies.sh:/docker-entrypoint.d/40-lb-trusted-proxies.sh:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 e não localhost: no container, localhost resolve para ::1 (IPv6)
      # e o Nginx só escuta em IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5

  # OPCIONAL — Cloudflare Tunnel (plano gratuito do Cloudflare como "balanceador" externo, com 1 VM).
  # A VM abre uma conexão CRIPTOGRAFADA de saída até o Cloudflare e o tráfego chega por ela: nenhuma porta
  # precisa ficar aberta na internet e o trecho Cloudflare → VM não passa em HTTP puro. Só sobe com
  # `--profile tunnel`. No painel do Cloudflare (Zero Trust → Networks → Tunnels) crie o túnel, aponte o
  # hostname público (ex.: api.seudominio.com) para http://nginx:80 e coloque o token em CLOUDFLARE_TUNNEL_TOKEN.
  # O Nginx recebe a conexão do container do túnel (rede interna do Docker): use
  # LB_TRUSTED_CIDRS=172.16.0.0/12 (faixa das redes do Docker) para ele confiar no IP do cliente que o
  # Cloudflare informa. Passo a passo no README, "Deploy gratuito".
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      nginx:
        condition: service_healthy
