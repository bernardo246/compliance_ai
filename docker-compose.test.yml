# Override SÓ para testes: expõe o Redis do Compose em localhost:6379, para os
# scripts que rodam no host (backend/scripts/test-queue-race.ts e
# test-double-stall.ts) enfileirarem direto nele.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# Não use em produção: expõe o Redis (sem senha) na máquina.

services:
  redis:
    ports:
      - "6379:6379"
