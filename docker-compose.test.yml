# Override SÓ para testes:
#  - expõe o Redis do Compose em localhost:6379, para os scripts que rodam no
#    host (backend/scripts/test-queue-race.ts, test-double-stall.ts,
#    test-recovery-sweep.ts, test-alerts-live.js...) enfileirarem/inspecionarem direto nele;
#  - encurta a varredura periódica de documentos parados para 30 s (em
#    produção o padrão é 5 min), para o teste não esperar minutos;
#  - alertas: avaliação a cada 10 s, repetição do mesmo alerta só depois de 60 s, e o
#    webhook aponta para o receptor local que test-alerts-live.js sobe na porta 9099.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# Não use em produção: expõe o Redis (sem senha) na máquina.

services:
  redis:
    ports:
      - "6379:6379"
  backend:
    environment:
      ANALYSIS_RECOVERY_INTERVAL_MS: "30000"
      ALERT_CHECK_INTERVAL_MS: "10000"
      ALERT_COOLDOWN_MS: "60000"
      ALERT_WEBHOOK_URL: "http://host.docker.internal:9099/hook"
      ALERT_WEBHOOK_FORMAT: "generic"
    extra_hosts:
      - "host.docker.internal:host-gateway"
