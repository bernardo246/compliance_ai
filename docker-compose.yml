# LOCAL E TESTES (produção é o docker-compose.prod.yml). Simula múltiplas réplicas do
# backend compartilhando um único Redis pela rede do Docker (não por localhost).
#
#   docker compose up -d --build        # sobe Redis + 3 réplicas + Nginx
#   docker compose up -d redis          # só o Redis (para rodar o backend com npm run start:dev)
#   docker compose up -d --scale backend=5   # muda o número de réplicas
#   docker compose down                 # derruba tudo (o volume do Redis fica)
#
# Os segredos vêm de backend/.env (não versionado) e nunca entram na imagem.
# O backend não publica porta no host: várias réplicas não podem ocupar a
# mesma porta. A entrada externa é o Nginx (Fase 8), em http://localhost:8080,
# que reparte as requisições entre as réplicas.

services:
  redis:
    image: redis:7-alpine
    # AOF: a fila (BullMQ) sobrevive a um restart do Redis.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # Só na própria máquina (127.0.0.1): permite rodar o backend FORA do Docker
    # (npm run start:dev, REDIS_URL=redis://localhost:6379) usando este Redis.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: compliance-backend:local
    env_file: ./backend/.env
    environment:
      # Sobrescreve o REDIS_URL do .env (que aponta para localhost): dentro
      # da rede do Compose, o Redis é alcançado pelo nome do serviço.
      REDIS_URL: redis://redis:6379
      # Fase 8 — o backend está atrás do Nginx: confiar no X-Forwarded-For
      # para req.ip (rate limit e auditoria) refletir o cliente, não o proxy.
      TRUST_PROXY: "true"
      # Só o ambiente local liga o endpoint de diagnóstico /api/debug/instance
      # (usado pelos testes de load balancer). Em produção fica desligado (404).
      ENABLE_DEBUG_ENDPOINT: "true"
      # Ajustes para os scripts de teste (backend/scripts/test-*.js|ts) não esperarem minutos.
      # Em produção valem os padrões (5 min de varredura, alertas a cada 1 min, repetição em 30 min).
      ANALYSIS_RECOVERY_INTERVAL_MS: "30000"
      ALERT_CHECK_INTERVAL_MS: "10000"
      ALERT_COOLDOWN_MS: "60000"
      # Webhook de alertas = o receptor local que test-alerts-live.js sobe na porta 9099 (sobrescreve o
      # do .env: o ambiente local nunca avisa o canal real).
      ALERT_WEBHOOK_URL: "http://host.docker.internal:9099/hook"
      ALERT_WEBHOOK_FORMAT: "generic"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 3

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 e não localhost: no container, localhost resolve para ::1 (IPv6)
      # e o Nginx só escuta em IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
