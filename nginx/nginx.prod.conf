# Produção — o Nginx é a BORDA da VM: termina o HTTPS e reparte as requisições
# entre as réplicas do backend. Montado em /etc/nginx/conf.d/default.conf
# (ver docker-compose.prod.yml). O certificado vem de ./certs (fullchain.pem e
# privkey.pem) — quem o emite (Let's Encrypt, certificado do provedor etc.) é
# um passo à parte, descrito no README.
#
# Por ser a borda, ele SOBRESCREVE o X-Forwarded-For com o IP de quem conectou
# (não acrescenta): o cliente não consegue forjar o IP usado pelo rate limit e
# pelos logs de auditoria. Se algum dia houver OUTRO proxy/CDN na frente deste
# Nginx, esta configuração precisa mudar (ver README, "Migrar para produção").

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # DNS embutido do Docker: re-resolve `backend` a cada 5 s, então réplicas
    # criadas ou removidas entram e saem da rotação sem reiniciar o Nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Uploads aceitam até 20 MB; o padrão do Nginx (1 MB) devolveria 413.
    client_max_body_size 25m;

    location / {
        set $backend http://backend:3001;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;

        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
    }
}
