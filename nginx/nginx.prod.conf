# Produção com VÁRIAS VMs — o Nginx da VM fica ATRÁS de um load balancer do provedor.
# Montado em /etc/nginx/conf.d/default.conf (ver docker-compose.prod.yml).
#
#   internet ──HTTPS──► load balancer do provedor ──HTTP──► [ VM 1: nginx ► N réplicas ]
#                       (termina o TLS, health check,      [ VM 2: nginx ► N réplicas ]
#                        redireciona HTTP→HTTPS)           [ VM n ...                  ]
#
# Características:
#  - escuta só HTTP (80): o TLS termina no load balancer; sem certificado aqui;
#  - o IP do cliente vem do X-Forwarded-For que o load balancer preenche, mas SÓ se a conexão vier de
#    uma faixa em LB_TRUSTED_CIDRS (real_ip; ver nginx/lb-trusted-proxies.sh). Qualquer outra origem
#    tem o cabeçalho ignorado: não dá para forjar o IP, nem batendo direto na VM;
#  - depois do real_ip, o X-Forwarded-For repassado ao backend é de novo UM só IP (o do cliente), então
#    o `trust proxy = 1` do backend continua certo.
# O firewall da VM deve aceitar a porta 80 SÓ das faixas do load balancer (defesa em profundidade).

# O load balancer pode acrescentar mais de um IP ao X-Forwarded-For (ex.: cliente e o próprio IP):
# o recursive pula, da direita para a esquerda, os que são de proxies confiáveis.
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name _;

    # Health check do container (Docker).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Uploads aceitam até 20 MB; o padrão do Nginx (1 MB) devolveria 413.
    client_max_body_size 25m;

    location / {
        set $backend http://backend:3001;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # $remote_addr já é o IP real do cliente (real_ip). Sobrescreve, não acrescenta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # O TLS terminou no load balancer; para a aplicação, a conexão original era HTTPS.
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;

        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
    }
}
