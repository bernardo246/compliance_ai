# Fase 8 — load balancer na frente das réplicas do backend.
#
# Montado em /etc/nginx/conf.d/default.conf (ver docker-compose.yml).
#
# O nome `backend` é o serviço do Compose: o DNS embutido do Docker (127.0.0.11)
# devolve o IP de TODAS as réplicas. Como `proxy_pass` usa uma VARIÁVEL, o
# Nginx re-resolve o nome a cada `valid=5s` em vez de só no startup — assim,
# réplicas criadas/removidas com `--scale` entram/saem da rotação sem
# reiniciar o Nginx, e as requisições são repartidas em rodízio entre os IPs
# resolvidos.

server {
    listen 80;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Uploads aceitam até 20 MB (MAX_UPLOAD_SIZE_MB); o default do Nginx (1 MB)
    # devolveria 413 antes de a requisição chegar ao backend.
    client_max_body_size 25m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $backend http://backend:3001;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # O Nginx é a borda: SOBRESCREVE o X-Forwarded-For com o IP que
        # conectou, em vez de acrescentar (`$proxy_add_x_forwarded_for`),
        # para um cliente não conseguir forjar o IP mandando o próprio
        # header (o rate limit e o log de auditoria do backend usam req.ip,
        # que depende de TRUST_PROXY=true + este header).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;

        # Réplica caiu / não respondeu ao conectar: tenta a próxima. Não
        # repete requisições já enviadas que não sejam idempotentes (POST).
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
    }
}
