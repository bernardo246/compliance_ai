<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img">
<title>Arquitetura de produção com várias VMs</title>
<desc>O navegador carrega o frontend e chama a API por HTTPS no load balancer do provedor, que reparte as requisições entre as VMs e tira do rodízio a que falhar no health check. Em cada VM, um Nginx reparte entre as réplicas do backend. Todas as VMs usam o mesmo Redis gerenciado, o Supabase e a OpenRouter.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.mk{stroke:#5F5E5A;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.neutral rect{fill:#FAFAF8;stroke:#888780;stroke-width:0.75}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.75}
.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.75}
.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}
.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
@media (prefers-color-scheme: dark){
.bg{fill:#1f1f1e}
.th{fill:#F1EFE8}.ts{fill:#B4B2A9}
.arr,.mk{stroke:#B4B2A9}
.neutral rect{fill:#2C2C2A;stroke:#888780}
.gray rect{fill:#444441;stroke:#B4B2A9}
.gray .th{fill:#D3D1C7}.gray .ts{fill:#B4B2A9}
.purple rect{fill:#3C3489;stroke:#AFA9EC}
.purple .th{fill:#CECBF6}.purple .ts{fill:#AFA9EC}
.teal rect{fill:#085041;stroke:#5DCAA5}
.teal .th{fill:#9FE1CB}.teal .ts{fill:#5DCAA5}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="590" rx="12"/>
<g class="neutral"><rect x="40" y="30" width="160" height="56" rx="8"/><text class="th" x="120.0" y="48" text-anchor="middle" dominant-baseline="central">Navegador</text><text class="ts" x="120.0" y="68" text-anchor="middle" dominant-baseline="central">usuário</text></g>
<line class="arr" x1="200" y1="58" x2="416" y2="58" marker-end="url(#arrow)"/>
<g class="neutral"><rect x="420" y="30" width="200" height="56" rx="8"/><text class="th" x="520.0" y="48" text-anchor="middle" dominant-baseline="central">Frontend Next.js</text><text class="ts" x="520.0" y="68" text-anchor="middle" dominant-baseline="central">hospedado à parte</text></g>
<line class="arr" x1="120" y1="86" x2="120" y2="126" marker-end="url(#arrow)"/>
<g class="teal"><rect x="60" y="130" width="360" height="60" rx="8"/><text class="th" x="240.0" y="148" text-anchor="middle" dominant-baseline="central">Load balancer do provedor</text><text class="ts" x="240.0" y="168" text-anchor="middle" dominant-baseline="central">HTTPS e certificado · health check</text></g>
<g class="purple"><rect x="60" y="240" width="170" height="150" rx="12"/><text class="th" x="145" y="258" text-anchor="middle" dominant-baseline="central">VM 1</text></g><g class="neutral"><rect x="72" y="268" width="146" height="50" rx="8"/><text class="th" x="145.0" y="286" text-anchor="middle" dominant-baseline="central">Nginx</text><text class="ts" x="145.0" y="306" text-anchor="middle" dominant-baseline="central">balanceador interno</text></g><g class="neutral"><rect x="72" y="334" width="146" height="48" rx="8"/><text class="th" x="145.0" y="352" text-anchor="middle" dominant-baseline="central">Backend NestJS</text><text class="ts" x="145.0" y="372" text-anchor="middle" dominant-baseline="central">N réplicas</text></g>
<g class="purple"><rect x="250" y="240" width="170" height="150" rx="12"/><text class="th" x="335" y="258" text-anchor="middle" dominant-baseline="central">VM 2</text></g><g class="neutral"><rect x="262" y="268" width="146" height="50" rx="8"/><text class="th" x="335.0" y="286" text-anchor="middle" dominant-baseline="central">Nginx</text><text class="ts" x="335.0" y="306" text-anchor="middle" dominant-baseline="central">balanceador interno</text></g><g class="neutral"><rect x="262" y="334" width="146" height="48" rx="8"/><text class="th" x="335.0" y="352" text-anchor="middle" dominant-baseline="central">Backend NestJS</text><text class="ts" x="335.0" y="372" text-anchor="middle" dominant-baseline="central">N réplicas</text></g>
<line class="arr" x1="110" y1="190" x2="110" y2="264" marker-end="url(#arrow)"/>
<line class="arr" x1="335" y1="190" x2="335" y2="264" marker-end="url(#arrow)"/>
<text class="ts" x="500" y="300" text-anchor="middle" dominant-baseline="central">VM 3, 4... entram da</text><text class="ts" x="500" y="318" text-anchor="middle" dominant-baseline="central">mesma forma</text>
<line class="arr" x1="145" y1="390" x2="145" y2="430"/>
<line class="arr" x1="335" y1="390" x2="335" y2="430"/>
<line class="arr" x1="130" y1="430" x2="550" y2="430"/>
<line class="arr" x1="130" y1="430" x2="130" y2="466" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="430" x2="340" y2="466" marker-end="url(#arrow)"/>
<line class="arr" x1="550" y1="430" x2="550" y2="466" marker-end="url(#arrow)"/>
<g class="teal"><rect x="40" y="470" width="180" height="56" rx="8"/><text class="th" x="130.0" y="488" text-anchor="middle" dominant-baseline="central">Redis gerenciado</text><text class="ts" x="130.0" y="508" text-anchor="middle" dominant-baseline="central">fila · rate limit · cache</text></g>
<g class="neutral"><rect x="250" y="470" width="180" height="56" rx="8"/><text class="th" x="340.0" y="488" text-anchor="middle" dominant-baseline="central">Supabase</text><text class="ts" x="340.0" y="508" text-anchor="middle" dominant-baseline="central">banco e arquivos</text></g>
<g class="neutral"><rect x="460" y="470" width="180" height="56" rx="8"/><text class="th" x="550.0" y="488" text-anchor="middle" dominant-baseline="central">OpenRouter</text><text class="ts" x="550.0" y="508" text-anchor="middle" dominant-baseline="central">modelo de IA</text></g>
<g class="purple"><rect x="40" y="561" width="14" height="14" rx="3"/></g><text class="ts" x="62" y="568" dominant-baseline="central">VM com o nosso código</text>
<g class="teal"><rect x="260" y="561" width="14" height="14" rx="3"/></g><text class="ts" x="282" y="568" dominant-baseline="central">serviço gerenciado</text>
<g class="neutral"><rect x="460" y="561" width="14" height="14" rx="3"/></g><text class="ts" x="482" y="568" dominant-baseline="central">fora da nossa rede</text>
</svg>
