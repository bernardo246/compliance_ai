<svg xmlns="http://www.w3.org/2000/svg" width="680" height="575" viewBox="0 0 680 575" role="img">
<title>Arquitetura de produção</title>
<desc>O navegador carrega o frontend e chama a API por HTTPS. Na VM rodam o Nginx e as réplicas do backend. O backend usa um Redis gerenciado em IP privado na mesma rede, o Supabase para banco e arquivos, e o OpenRouter para a IA.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.mk{stroke:#5F5E5A;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.neutral rect{fill:#FAFAF8;stroke:#888780;stroke-width:0.75}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.75}
.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.75}
.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}
.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
@media (prefers-color-scheme: dark){
.bg{fill:#1f1f1e}
.th{fill:#F1EFE8}.ts{fill:#B4B2A9}
.arr,.mk{stroke:#B4B2A9}
.neutral rect{fill:#2C2C2A;stroke:#888780}
.gray rect{fill:#444441;stroke:#B4B2A9}
.gray .th{fill:#D3D1C7}.gray .ts{fill:#B4B2A9}
.purple rect{fill:#3C3489;stroke:#AFA9EC}
.purple .th{fill:#CECBF6}.purple .ts{fill:#AFA9EC}
.teal rect{fill:#085041;stroke:#5DCAA5}
.teal .th{fill:#9FE1CB}.teal .ts{fill:#5DCAA5}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="575" rx="12"/>
<g class="neutral"><rect x="40" y="30" width="160" height="56" rx="8"/><text class="th" x="120" y="48" text-anchor="middle" dominant-baseline="central">Navegador</text><text class="ts" x="120" y="68" text-anchor="middle" dominant-baseline="central">usuário</text></g>
<line class="arr" x1="200" y1="58" x2="416" y2="58" marker-end="url(#arrow)"/>
<g class="neutral"><rect x="420" y="30" width="200" height="56" rx="8"/><text class="th" x="520" y="48" text-anchor="middle" dominant-baseline="central">Frontend Next.js</text><text class="ts" x="520" y="68" text-anchor="middle" dominant-baseline="central">app.seudominio.com</text></g>
<g class="gray"><rect x="40" y="130" width="600" height="290" rx="20"/><text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">Nuvem</text><text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">mesma região e rede privada</text></g>
<g class="purple"><rect x="60" y="190" width="360" height="210" rx="12"/><text class="th" x="240" y="214" text-anchor="middle" dominant-baseline="central">VM</text><text class="ts" x="240" y="232" text-anchor="middle" dominant-baseline="central">Docker Compose</text></g>
<g class="neutral"><rect x="84" y="248" width="312" height="48" rx="8"/><text class="th" x="240" y="264" text-anchor="middle" dominant-baseline="central">Nginx</text><text class="ts" x="240" y="282" text-anchor="middle" dominant-baseline="central">HTTPS, api.seudominio.com</text></g>
<g class="neutral"><rect x="84" y="316" width="312" height="64" rx="8"/><text class="th" x="240" y="338" text-anchor="middle" dominant-baseline="central">Backend NestJS</text><text class="ts" x="240" y="358" text-anchor="middle" dominant-baseline="central">N réplicas: API e worker</text></g>
<g class="teal"><rect x="452" y="190" width="168" height="210" rx="12"/><text class="th" x="536" y="262" text-anchor="middle" dominant-baseline="central">Redis gerenciado</text><text class="ts" x="536" y="284" text-anchor="middle" dominant-baseline="central">alta disponibilidade</text><text class="ts" x="536" y="304" text-anchor="middle" dominant-baseline="central">só IP privado</text><text class="ts" x="536" y="324" text-anchor="middle" dominant-baseline="central">TLS e senha</text></g>
<line class="arr" x1="120" y1="86" x2="120" y2="244" marker-end="url(#arrow)"/>
<line class="arr" x1="240" y1="296" x2="240" y2="312" marker-end="url(#arrow)"/>
<line class="arr" x1="396" y1="348" x2="448" y2="348" marker-end="url(#arrow)"/>
<line class="arr" x1="150" y1="380" x2="150" y2="466" marker-end="url(#arrow)"/>
<line class="arr" x1="360" y1="380" x2="360" y2="466" marker-end="url(#arrow)"/>
<g class="neutral"><rect x="60" y="470" width="180" height="56" rx="8"/><text class="th" x="150" y="488" text-anchor="middle" dominant-baseline="central">Supabase</text><text class="ts" x="150" y="508" text-anchor="middle" dominant-baseline="central">banco e arquivos</text></g>
<g class="neutral"><rect x="270" y="470" width="180" height="56" rx="8"/><text class="th" x="360" y="488" text-anchor="middle" dominant-baseline="central">OpenRouter</text><text class="ts" x="360" y="508" text-anchor="middle" dominant-baseline="central">modelo de IA</text></g>
<g class="purple"><rect x="40" y="541" width="14" height="14" rx="3"/></g><text class="ts" x="62" y="548" dominant-baseline="central">VM com o nosso código</text>
<g class="teal"><rect x="260" y="541" width="14" height="14" rx="3"/></g><text class="ts" x="282" y="548" dominant-baseline="central">serviço gerenciado</text>
<g class="neutral"><rect x="460" y="541" width="14" height="14" rx="3"/></g><text class="ts" x="482" y="548" dominant-baseline="central">fora da nossa rede</text>
</svg>
